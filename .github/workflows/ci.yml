name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore QaApiAutomation.sln

      - name: SonarQube Cloud Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner begin /k:"andrerfcs_qa-api-automation-csharp" /o:"andrerfcs" /d:sonar.token="$SONAR_TOKEN" /d:sonar.coverage.exclusions="dashboard/**,reports/**"

      - name: Build solution
        run: dotnet build QaApiAutomation.sln --no-restore

      - name: Run tests
        run: dotnet test QaApiAutomation.sln --no-build --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Generate execution report
        if: always()
        shell: pwsh
        run: ./reports/generate-report.ps1

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-report
          path: reports/execution-report.html
          if-no-files-found: error

      - name: SonarQube Cloud End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
